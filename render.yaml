# Déploiement de Weldon sur Render (render.com → New → Blueprint).
# Les clés secrètes (sync: false) sont demandées par Render à la création.
# Plan gratuit pour la phase de test : le site se met en veille après 15 min d'inactivité
# et les données locales (appareils, quotas) repartent à zéro à chaque redémarrage.
# Pour le lancement : plan payant + disque persistant (voir le commentaire en bas).
services:
  - type: web
    name: weldon
    runtime: node
    rootDir: weldon/server
    branch: ccr-1380d074-4mi11g
    buildCommand: npm ci
    startCommand: npm start
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: TOKEN_SECRET
        generateValue: true
      - key: CHARIOW_API_KEY
        sync: false
      - key: CHARIOW_PRODUCT_ID
        value: prd_9rngwe51
      - key: CHARIOW_PULSE_SECRET
        sync: false
      # E-mail(s) du concepteur : accès complet sans payer (séparés par des virgules)
      - key: ADMIN_EMAILS
        sync: false
      # Base PostgreSQL gratuite (ex. Neon) : sans elle, les comptes sont effacés à chaque redémarrage
      - key: DATABASE_URL
        sync: false
      - key: PRICE_XAF
        value: "10000"
    # Lancement : remplacer « plan: free » par « plan: 0.5c-512mb » et ajouter :
    #   disk: { name: weldon-data, mountPath: /data, sizeGB: 1 }
    # ainsi que la variable DATA_DIR=/data.
