# Rekort : site statique (dossier site/) + une fonction d'API (netlify/functions/api.mjs) + stockage Netlify Blobs.
[build]
  publish = "site"
  command = "node tools/gen-sw.mjs"
  functions = "netlify/functions"
  # Économie de crédits : un déploiement de production coûte des crédits sur l'offre gratuite.
  # On ne déploie que si le message du dernier commit contient [deploy] (sinon le build est ignoré).
  ignore = "git log -1 --pretty=%B | grep -q '\\[deploy\\]' && exit 1 || exit 0"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), serial=()"
    # Aucun script extérieur ni en ligne n'est exécuté : une injection de code dans une page ne peut ni s'exécuter ni envoyer les données ailleurs.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
